name: Build Electron App

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build for ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows Build Job
          - os: windows-latest
            arch: x64
            platform: win32
            
          # macOS Build Job (Runs natively on macOS runners)
          - os: macos-latest
            arch: x64
            platform: darwin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Build & Package Script
        run: node build.js

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FocusBrowser-build-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/
          retention-days: 14