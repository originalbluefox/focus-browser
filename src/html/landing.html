<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    
    <!-- Import Outfit Font -->
    <link rel="stylesheet" href="../css/stylesheet.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-color: #0c0c0d;
            --card-bg: #1c1b22;
            --card-hover: #2b2a33;
            --text-color: #f9f9fb;
            --muted-color: #8f8f9d;
            --accent-color: #00ddff;
            --font-main: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* Color Theme Overrides */
        body[data-theme="dark"] {
            --bg-color: #0c0c0d;
            --card-bg: #1c1b22;
            --card-hover: #2b2a33;
            --text-color: #f9f9fb;
            --muted-color: #8f8f9d;
        }

        body[data-theme="light"] {
            --bg-color: #f9f9fb;
            --card-bg: #f0f0f4;
            --card-hover: #e0e0e6;
            --text-color: #15141a;
            --muted-color: #5b5b66;
        }

        body[data-theme="midnight"] {
            --bg-color: #050814;
            --card-bg: #0e172a;
            --card-hover: #1e293b;
            --text-color: #f8fafc;
            --muted-color: #64748b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* Center Content Layout */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 680px;
            padding: 0 20px;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
        }

        .brand-header h1 {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Search Box */
        .search-box {
            display: flex;
            align-items: center;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid transparent;
            border-radius: 28px;
            padding: 0 18px;
            height: 50px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .search-box:focus-within {
            background: var(--card-hover);
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(0, 221, 255, 0.3);
        }

        .search-icon {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            opacity: 0.8;
            flex-shrink: 0;
            stroke: var(--muted-color);
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            font-family: var(--font-main);
            font-size: 15px;
            font-weight: 400;
        }

        .search-box input::placeholder {
            color: var(--muted-color);
        }

        /* Customize Toggle Button */
        .customize-btn {
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 36px;
            height: 36px;
            background: var(--card-bg);
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-color);
            transition: background 0.15s ease;
            z-index: 10;
        }

        .customize-btn:hover {
            background: var(--card-hover);
        }

        /* Side Panel Drawer */
        .side-panel {
            position: fixed;
            top: 0;
            right: -320px;
            width: 320px;
            height: 100%;
            background: var(--card-bg);
            box-shadow: -4px 0 16px rgba(0, 0, 0, 0.3);
            transition: right 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            z-index: 100;
        }

        .side-panel.open {
            right: 0;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .close-panel-btn {
            background: transparent;
            border: none;
            color: var(--muted-color);
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
        }

        .close-panel-btn:hover {
            color: var(--text-color);
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .setting-group select {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--muted-color);
            border-radius: 8px;
            font-family: var(--font-main);
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        /* Overlay Backdrop */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 90;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="overlay" id="overlay"></div>

    <div class="main-content">
        <div class="brand-header">
            <svg class="brand-logo" viewBox="0 0 32 32" fill="none">
                <circle cx="16" cy="16" r="14" fill="url(#brand-grad)"/>
                <defs>
                    <linearGradient id="brand-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#FF9400"/>
                        <stop offset="0.5" stop-color="#FF0061"/>
                        <stop offset="1" stop-color="#9059FF"/>
                    </linearGradient>
                </defs>
            </svg>
            <h1>Aether</h1>
        </div>

        <form class="search-box" id="search-form">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="landing-input" placeholder="Search or enter address" autofocus autocomplete="off" />
        </form>
    </div>

    <button class="customize-btn" id="open-panel-btn" title="Customize page">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
    </button>

    <!-- Settings Side Panel -->
    <aside class="side-panel" id="side-panel">
        <div class="panel-header">
            <h2>Customize New Tab</h2>
            <button class="close-panel-btn" id="close-panel-btn">&times;</button>
        </div>

        <div class="setting-group">
            <label for="search-engine-select">Search Engine</label>
            <select id="search-engine-select">
                <option value="https://google.com/search?q=">Google</option>
                <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
                <option value="https://www.bing.com/search?q=">Bing</option>
                <option value="https://search.brave.com/search?q=">Brave</option>
            </select>
        </div>

        <div class="setting-group">
            <label for="theme-select">Theme</label>
            <select id="theme-select">
                <option value="dark">Dark (Aether Default)</option>
                <option value="midnight">Midnight Blue</option>
                <option value="light">Light</option>
            </select>
        </div>
    </aside>

    <script>
        const SEARCH_ENGINES = {
            'https://google.com/search?q=': 'Google',
            'https://duckduckgo.com/?q=': 'DuckDuckGo',
            'https://www.bing.com/search?q=': 'Bing',
            'https://search.brave.com/search?q=': 'Brave'
        };

        const panel = document.getElementById('side-panel');
        const overlay = document.getElementById('overlay');
        const openBtn = document.getElementById('open-panel-btn');
        const closeBtn = document.getElementById('close-panel-btn');

        const searchForm = document.getElementById('search-form');
        const searchInput = document.getElementById('landing-input');
        const engineSelect = document.getElementById('search-engine-select');
        const themeSelect = document.getElementById('theme-select');

        // Safe localStorage helpers
        let storage = {
            theme: "dark",
            search_engine: "https://duckduckgo.com/?q="
        }

        function safeGetStorage(key, fallback){
            return storage[key] || fallback;
        }

        function safeSetStorage(key, value){
            storage[key] = value;
            return true;
        }
        function togglePanel(open) {
            panel.classList.toggle('open', open);
            overlay.classList.toggle('active', open);
        }

        openBtn.addEventListener('click', () => togglePanel(true));
        closeBtn.addEventListener('click', () => togglePanel(false));
        overlay.addEventListener('click', () => togglePanel(false));

        function loadSettings() {
            const savedTheme = safeGetStorage('theme', 'dark');
            const savedEngine = safeGetStorage('search_engine', 'https://google.com/search?q=');

            document.body.setAttribute('data-theme', savedTheme);
            themeSelect.value = savedTheme;

            engineSelect.value = savedEngine;
            updateSearchPlaceholder(savedEngine);
        }

        function updateSearchPlaceholder(engineUrl) {
            const engineName = SEARCH_ENGINES[engineUrl] || 'Google';
            searchInput.placeholder = `Search with ${engineName} or enter address`;
        }

        themeSelect.addEventListener('change', (e) => {
            const theme = e.target.value;
            document.body.setAttribute('data-theme', theme);
            safeSetStorage('theme', theme);
        });
        engineSelect.addEventListener('change', (e) => {
            console.log("engine select updated")
            const engineUrl = e.target.value;
            safeSetStorage('search_engine', engineUrl);
           try {
                window.parent.postMessage({ type: 'SET_SEARCH_ENGINE', engineUrl }, '*');
            } catch (err) {
                console.warn('[Landing] Failed to send postMessage:', err);
            }
            
            updateSearchPlaceholder(engineUrl);
        });

        function navigate() {
            const query = searchInput.value.trim();
            if (!query) return;

            const engineUrl = safeGetStorage('search_engine', 'https://google.com/search?q=');
            
            let targetUrl;
            if (/^(https?:\/\/|[a-zA-Z0-9-]+\.[a-zA-Z]{2,})/.test(query)) {
                targetUrl = query.startsWith('http') ? query : `https://${query}`;
            } else {
                targetUrl = engineUrl + encodeURIComponent(query);
            }

            window.location.href = targetUrl;
        }

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                navigate();
            }
        });

        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            navigate();
        });

        loadSettings();
    </script>
</body>
</html>
