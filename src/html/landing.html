<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether - New Tab</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .landing-container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #ffffff;
        }

        p {
            font-size: 14px;
            color: #888;
            margin-bottom: 24px;
        }

        .search-box {
            display: flex;
            width: 100%;
            background: #252525;
            border: 1px solid #444;
            border-radius: 8px;
            overflow: hidden;
            padding: 4px;
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            padding: 10px 14px;
            font-size: 15px;
        }

        .search-box button {
            background: #3b82f6;
            border: none;
            color: #fff;
            padding: 10px 20px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-box button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>

    <div class="landing-container">
        <h1>Aether Browser</h1>
        <p>Explore, study, and stay focused.</p>
        
        <form class="search-box" onsubmit="event.preventDefault(); window.location.href = 'https://google.com/search?q=' + encodeURIComponent(document.getElementById('landing-input').value);">
            <input type="text" id="landing-input" placeholder="Search Google or type a URL..." autofocus />
            <button type="submit">Search</button>
        </form>
    </div>

</body>
</html>
