<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether - Study Browser</title>
    <link rel="stylesheet" href="../css/index.css">
</head>

<body>

    <!-- Window Drag Title & Tab Strip -->
    <div id="title-bar">
        <span class="app-title">Aether</span>
        
        <div id="tab-strip-holder">
            <!-- Tabs will be injected dynamically here -->
            <div id="tab-strip"></div>
            <!-- <button type="button" class="new-tab-btn" id="new-tab-btn" title="Open New Tab">+</button> -->
        </div>
    </div>

    <!-- Navigation & Address Toolbar -->
    <div id="nav-bar">
        <form id="address-controls" onsubmit="event.preventDefault();">
            <button type="button" class="nav-btn" id="back-btn" title="Back">←</button>
            <button type="button" class="nav-btn" id="reload-btn" title="Reload">↻</button>
            <input type="text" id="url-input" value="https://google.com" placeholder="Search query or enter URL..." />
            <button type="button" class="nav-btn" id="go-btn">Go</button>
        </form>

        <div class="right-bar-actions">
            <!-- Search Engine Selector -->
            <select id="search-engine-select" class="select-dropdown" title="Choose Search Engine">
                <option value="https://google.com/search?q=">Google</option>
                <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
                <option value="https://www.bing.com/search?q=">Bing</option>
            </select>

            <!-- AI Assistant Selector -->
            <select id="ai-assistant-select" class="select-dropdown" title="Choose AI Assistant">
                <option value="https://gemini.google.com">Gemini</option>
                <option value="https://chatgpt.com">ChatGPT</option>
                <option value="https://claude.ai">Claude</option>
            </select>

            <button type="button" class="toggle-btn" id="toggle-ai">Toggle AI</button>
            <button type="button" class="toggle-btn" id="showButton" onclick="toggleStatusText()">Details</button>
            <button type="button" class="toggle-btn" id="to-ai-btn">Page → AI</button>
            <button type="button" class="toggle-btn" id="to-page-btn">AI → Page</button>
        </div>
    </div>

    <!-- Workspace Viewports -->
    <div id="app-viewport">
        <div id="work-container">
            <!-- Dynamic webviews will be injected here per tab -->
        </div>

        <div id="ai-container">
            <webview id="ai-view" src="https://gemini.google.com"></webview>
        </div>
    </div>

    <!-- Info Footer -->
    <div id="status-footer">
        <p id="version">Version: </p>
        <p id="message">Ready</p>
        <p id="update-link">Updates: <a href="https://github.com/originalbluef3x/study-browser/releases" target="_blank">GitHub Releases</a></p>
    </div>

    <!-- Main Entry Point -->
    <script src="../js/app.js"></script>
</body>
</html>
